# Provider overlay for the shared data stack: ONE db + solr, restored from a seed, that several
# feature stacks read instead of each restoring its own (~19-32G db + ~9G solr apiece). Used as
#
#   docker-compose.yml + this   (project = the ZFIN_SHARED_PROJECT setting, default zfin_shared)
#
# via `z shared up`. A feature opts in with `z feature new --shared-db`, which suppresses its
# own db/solr (docker-compose.overlay-shared-db.yml) and then `docker network connect`s THESE
# containers into that feature's own default network, aliased db and solr. The app tier is
# never attached to this stack's network -- multi-homing tomcat breaks catalina's
# -Djava.rmi.server.hostname, which is the constraint the whole arrangement is shaped around.
#
# SHARED DATA == SHARED WRITES: every attached feature reads and writes the SAME zfindb and
# solr index. Safe only for read-mostly work -- a migration, a reindex or a curation edit by
# one feature is instantly visible to, and can break, the others. There is no cheap
# write-isolation: a separate DATABASE per feature is a full copy, which negates the saving.
# See docs/dev-stacks.md.
#
# The label is how z tells a shared stack it runs from a real instance that ZFIN_SHARED_PROJECT
# may also name (StackConfig.SHARED_DATA_LABEL): `z shared` refuses to manage a project whose db
# lacks it, and `z feature new --shared-db` warns that it is about to write a live database.
networks:
  shared:
    # Not declared external, and not given a fixed name: features reach these containers by
    # having them connected INTO their own network, not by joining this one.
services:
  db:
    # No host port. These are reached over the network, and the base file's port comes from the
    # same docker/.env the main checkout's own stack uses -- so publishing here fights that stack
    # for the same address the moment both are up.
    ports: !reset null
    networks: [shared]
    labels:
      zfin.devstack.shared-data: "true"
  solr:
    ports: !reset null
    networks: [shared]
    labels:
      zfin.devstack.shared-data: "true"
