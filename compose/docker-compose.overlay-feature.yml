# The overlay of every stack this tooling makes: each feature stack (`z feature new` records it
# in the stack's .env as ZFIN_COMPOSE_OVERLAYS) and `z seed build`'s throwaway stack:
#
#   docker-compose.yml [+ docker-compose.overlay-shared-db.yml] + this [+ docker-compose.overlay-proxy-network.yml]
#
# Everything expressible as a VALUE lives in the stack's .env and is read by the base file:
# published ports (StackConfig.featureEnv). What is left here is what a value cannot
# say, or what the base file should not have to know about: suppressing services, not
# advertising to a proxy, Jenkins' half of DISABLE_OIDC, and the Claude sidecar.
services:
  # Advertise NOTHING to an outside nginx-proxy. The base file advertises DOCKER_VIRTUAL_HOST,
  # which is right for an instance behind one; a stack of ours on a proxy's host would otherwise
  # be published by that proxy without being on its network, and its name would answer 502.
  # Empty is equivalent to unset: nginx-proxy and acme-companion both skip an empty value.
  # docker-compose.overlay-proxy-network.yml, layered after this, advertises again for a stack
  # that does join the proxy's network.
  httpd:
    environment:
      VIRTUAL_HOST: ""
      LETSENCRYPT_HOST: ""
  # max_wal_size: the base file runs postgres with 10GB -- headroom for an instance's bulk
  # loads, and postgres keeps that much WAL around once it has written it (recycled segments
  # only drain as new WAL is written). A feature stack does not bulk-load, and 10GB of idle WAL
  # was ~40% of one feature's pg_data. 1GB is postgres' own default.
  # Appended AFTER the base file's flags rather than restating them: postgres takes the last
  # -c for a setting, and restating `command` here would apply one copy of it to every
  # feature, whichever branch its base file came from. "$$@" is that base command.
  # DOCKER_DB_MAX_WAL_SIZE in the stack's .env overrides it (z seed new sets 10GB: it loads).
  db:
    entrypoint:
      - sh
      - -c
      - exec docker-entrypoint.sh "$$@" -c max_wal_size=${DOCKER_DB_MAX_WAL_SIZE:-1GB}
      - docker-entrypoint.sh
  # Solr's heap GROWS to what a job needs instead of being reserved. The base file starts solr
  # with SOLR_HEAP, which bin/solr turns into -Xms=-Xmx and then pre-touches (AlwaysPreTouch):
  # the whole heap is resident from the first second, idle or not. Feature stacks had 4g that
  # way, which serving queries never needed and a full reindex outgrew -- the DIH entities
  # cache whole child tables in the heap (SortedMapBackedCache, ~30 per entity), and the
  # expression import ran 4g out (Solr 9 then aborts: exit 134, jvm_crash_<pid>.log).
  # So: commit 1g, allow 8g, and hand memory back once idle. G1PeriodicGCInterval runs a GC
  # after 60s without one -- i.e. only when solr is idle -- and -G1PeriodicGCInvokesConcurrent
  # makes it a full, compacting one: the default concurrent cycle frees nothing on an idle JVM,
  # since nothing allocates to drive the collections that would. Measured: a heap grown to
  # 4.7g was back to 1g (1.3g resident) within two minutes of idle; the pause took 143ms.
  # bin/solr reads SOLR_JAVA_MEM only when SOLR_HEAP is empty, hence blanking it.
  # mem_limit is heap max + ~4g for what lives outside the heap, as the base file sizes it; a
  # ceiling, not a reservation. Own variable names on purpose: every feature .env written
  # before this has DOCKER_SOLR_HEAP=4g / DOCKER_SOLR_MEM_LIMIT=6g, and `z feature refresh`
  # never rewrites a key, so reading those would hold existing stacks at the old sizing.
  # Those two keys do nothing under this overlay; these three override it per stack.
  solr:
    mem_limit: ${DOCKER_SOLR_MEM_MAX:-12g}
    environment:
      SOLR_HEAP: ""
      SOLR_JAVA_MEM: "-Xms${DOCKER_SOLR_HEAP_MIN:-1g} -Xmx${DOCKER_SOLR_HEAP_MAX:-8g} -XX:G1PeriodicGCInterval=60000 -XX:-G1PeriodicGCInvokesConcurrent"
  # certbot asks for a real certificate for the stack's hostname. A feature stack's name is not
  # publicly resolvable, so it fails on every `up` and reads as a failure in `docker ps -a`; an
  # outside proxy with acme-companion issues certificates itself if it can. Nothing depends on it.
  certbot:
    profiles: ["feature-certs"]
  # fail2ban runs with network_mode: host, so its bans land in the host's (or the Docker VM's)
  # iptables and block every stack on the machine, not just this one. Behind an outside proxy
  # every request arrives from the proxy's address, so a burst of 403s from one page load bans
  # the proxy itself.
  fail2ban:
    profiles: ["feature-fail2ban"]
  # DISABLE_OIDC=true opens httpd's /jobs gate (the base file), but Jenkins keeps its own OIDC
  # realm pointed at bouncer. The startup script swaps it for Jenkins' own user database and
  # puts OIDC back when the flag goes off; see compose/jenkins/zfin-security-realm.groovy, which
  # also explains the guard copy it leaves in jenkins_data for stacks without this overlay.
  # Mounted rather than deployed so it is always the current version and never outlives the
  # overlay; read-only so nothing in the stack can rewrite what runs as SYSTEM on every start.
  jenkins:
    environment:
      DISABLE_OIDC: ${DISABLE_OIDC:-false}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:-}
    volumes:
      # Absolute through ZFIN_COMPOSE_DIR, like the claude build context below. Outside z the
      # fallback names a path that doesn't exist, and create_host_path: false makes that an
      # error when Jenkins is created, not an empty directory mounted where the script should be.
      - type: bind
        source: ${ZFIN_COMPOSE_DIR:-/ZFIN_COMPOSE_DIR-unset--run-through-z}/jenkins/zfin-security-realm.groovy
        target: /opt/zfin/www_homes/zfin.org/server_apps/jenkins/jenkins-home/init.groovy
        read_only: true
        bind:
          create_host_path: false
  claude:
    # The per-feature Claude sidecar (docker/claude/Dockerfile).
    # Reached by the verb that already reaches services -- `./z run claude`, like `./z run
    # compile` -- so there is no bespoke command and no second way in. The profile keeps it out
    # of a plain `up`; `docker compose run <svc>` enables a service's own profile.
    profiles:
      - claude
    # The build context is this tool's compose/claude/. Paths in every -f file resolve against
    # the BASE file's directory (the ZFIN checkout's docker/), so it has to be absolute; z sets
    # ZFIN_COMPOSE_DIR for everything it runs. A fallback rather than `:?`, which would fail
    # every compose command on the stack run outside z, not only a build of this service.
    build:
      context: ${ZFIN_COMPOSE_DIR:-/ZFIN_COMPOSE_DIR-unset--build-claude-through-z}/claude
      args:
        ZFIN_RELEASE: ${ZFIN_RELEASE}
        DOCKER_ARCH: ${DOCKER_ARCH:-}
    # Local-only name (no ghcr.io prefix): a developer's agent environment is not registry
    # material.
    image: zfin-claude:${ZFIN_RELEASE}${DOCKER_ARCH:-}
    pull_policy: never
    environment:
      PGHOST: db
      PGUSER: postgres
      TZ: ${TZ}
      INSTANCE: ${DOCKER_INSTANCE}
      ZFIN_RELEASE: ${ZFIN_RELEASE}
      DOCKER_INSTANCE: ${DOCKER_INSTANCE}
      DOCKER_VIRTUAL_HOST: ${DOCKER_VIRTUAL_HOST}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      # Claude Code keeps ~/.claude.json BESIDE ~/.claude, so by default it lands in the
      # throwaway layer and every entry looks like a first-ever install -- asking you to log in
      # again with a valid token already present. Point it at the mounted volume and onboarding
      # happens once.
      CLAUDE_CONFIG_DIR: /home/gradle/.claude
      # Lets a session identify itself rather than infer it: /.dockerenv proves "a container",
      # this proves "the ZFIN sidecar", where `z` is a host command and refuses.
      ZFIN_SIDECAR: "true"
    volumes:
      # The one feature worktree, read-write -- the point of the thing.
      - ${DOCKER_SOURCE_ROOTS_PATH}:/opt/zfin/source_roots/zfin.org:rw
      # git: a feature's tree is a worktree, so these are the mounts
      # docker-compose.overlay-worktree.yml gives compile (see the reasons there). Spelled out
      # here because that overlay is also used without this one, by `z seed build`.
      - ${DOCKER_GIT_COMMON_DIR}:${DOCKER_GIT_COMMON_DIR}:rw
      - ${DOCKER_GIT_COMMON_DIR}/worktrees:${DOCKER_GIT_COMMON_DIR}/worktrees:ro
      - ${DOCKER_GIT_WORKTREE_DIR}:${DOCKER_GIT_WORKTREE_DIR}:rw
      - ${DOCKER_SOURCE_ROOTS_PATH}:${DOCKER_SOURCE_ROOTS_PATH}:rw
      # Its own ~/.claude, per stack. `z feature freeze` archives this volume, which is why the
      # auth token is NOT kept in it -- that comes from a host file, read-only, one file, so the
      # container can use the token but not rewrite it.
      - claude_home:/home/gradle/.claude
      - ${ZFIN_CLAUDE_TOKEN_FILE:-/dev/null}:/run/secrets/claude-token:ro
      # The Claude Code install itself (its npm prefix; see compose/claude/Dockerfile), writable
      # so the CLI's auto-updater works and kept in a volume so an update survives `run --rm`.
      # Docker seeds the volume from the image on first use; after that the updater owns it.
      - claude_code:/opt/claude-code
      # Dumps read-only, so `loaddb`/`loadsolr` work. Withholding them would buy nothing -- the
      # sidecar already reaches the live database over the compose network and can read every
      # row. Contrast /mnt/research, deliberately NOT mounted: that one spans other instances
      # and production unloads. :ro also means the agent cannot corrupt the dumps every other
      # stack loads from. (`loaddb` does destroy and rebuild THIS stack's database -- accepted,
      # because a thaw or re-seed restores it in about two minutes.)
      - ${DOCKER_DB_UNLOADS_PATH}:/opt/zfin/unloads/db:ro
      - ${DOCKER_SOLR_UNLOADS_PATH}:/opt/zfin/unloads/solr:ro
      # Build/deploy targets, so the agent can compile, test and dirtydeploy rather than handing
      # every build back to a human.
      - www_data:/opt/zfin/www_homes/zfin.org
      - catalina_base:/opt/zfin/catalina_bases/zfin.org
      # Jenkins' home, so `jenkins-cli` works in here as it does in `compile`. This path looks
      # like part of www_data but is its own volume mounted over that spot, and it holds
      # secrets/initialAdminPassword and the stored API token -- so this IS a credential, and a
      # deliberate exception to the no-credentials rule below. Accepted because the blast radius
      # is one feature stack's own Jenkins, triggering that stack's jobs against that stack's
      # database -- which the agent can already read directly over the compose network. Nothing
      # here reaches another stack, the host, or a remote.
      - jenkins_data:/opt/zfin/www_homes/zfin.org/server_apps/jenkins/jenkins-home
      # No tls_certs or keystore: they hold the stack's TLS private key, and the sidecar serves
      # no TLS (its profile does not run generate_base.sh; see compose/claude/Dockerfile).
      - static_data:/opt/zfin/static
      - maven_cache:/home/gradle/.m2
      - gradle_cache:/home/gradle/.gradle
      - npm_cache:/home/gradle/.npm
      # NO docker.sock and NO ssh-auth.sock, on purpose: either mount would make
      # `--dangerously-skip-permissions` here more dangerous than running on the host.
      # Omitting them is what makes "the agent cannot push" structural rather than a rule
      # someone has to remember.

volumes:
  claude_home:
  # One install for every stack on this machine, not one per stack: a binary, not state, so
  # there is nothing to isolate, and each stack would otherwise re-download every update.
  # Per architecture, since the install holds a native binary. Not in StackConfig.CLAUDE_VOL,
  # so freeze never archives it; delete it to reset to the image's version.
  claude_code:
    name: zfin-claude-code${DOCKER_ARCH:-}
