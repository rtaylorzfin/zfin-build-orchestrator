# Joins a feature stack's httpd to an outside nginx-proxy's network, so that proxy can route
# https://<DOCKER_VIRTUAL_HOST> to it. `z feature new` adds this overlay, after
# docker-compose.overlay-feature.yml, when the ZFIN_PROXY_NETWORK host setting names a network;
# it advertises the stack's name again, which the feature overlay clears. No proxy runs here:
# which one routes the stack, and how names resolve, is the host's business.
#
# A network cannot be conditional on a value -- `external: true` passes `config` and fails at
# `up` when the network is absent -- which is why this is an overlay rather than a line in the
# base file. VIRTUAL_PROTO/VIRTUAL_PORT stay at the base file's https/443: plain http to httpd
# loops the admin paths and drops the `Secure` session cookie.
services:
  httpd:
    environment:
      VIRTUAL_HOST: ${DOCKER_VIRTUAL_HOST}
      LETSENCRYPT_HOST: ${DOCKER_VIRTUAL_HOST}
    networks:
      default: {}
      proxy: {}
networks:
  proxy:
    external: true
    name: ${ZFIN_PROXY_NETWORK:?set ZFIN_PROXY_NETWORK to the network an outside nginx-proxy watches}
