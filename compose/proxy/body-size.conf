# Loaded by nginx-proxy from conf.d (mounted by compose/proxy.yml), so it applies to every
# feature stack it serves. nginx's default is 1m, which turned a 5 MB file upload to a Jenkins
# job into a 413 before it ever reached the stack. 0 = no limit at the proxy: this is a
# development proxy, and the stack's own httpd and Jenkins still enforce theirs.
client_max_body_size 0;
